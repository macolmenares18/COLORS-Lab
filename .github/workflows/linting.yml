name: Linting Workflow

# This triggers the robot on every push and pull request to the main branch
on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Lint HTML
        run: npx htmlhint "public/**/*.html"

      - name: Lint CSS
        run: npx stylelint "public/css/**/*.css"

      - name: Lint JavaScript
        run: npx eslint "public/js/**/*.js"

      - name: Run Jest Tests
        run: npm test